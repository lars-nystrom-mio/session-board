<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Board</title>
<link rel="icon" id="favicon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%2314151b'/%3E%3Crect%20x='5'%20y='5'%20width='10'%20height='10'%20rx='2.5'%20fill='%238be9fd'/%3E%3Crect%20x='17'%20y='5'%20width='10'%20height='10'%20rx='2.5'%20fill='%23bd93f9'/%3E%3Crect%20x='5'%20y='17'%20width='10'%20height='10'%20rx='2.5'%20fill='%2350fa7b'/%3E%3Crect%20x='17'%20y='17'%20width='10'%20height='10'%20rx='2.5'%20fill='%23868ba0'/%3E%3C/svg%3E">
<style>
  :root {
    --bg: #14151b;
    --panel: #1a1c24;
    --card: #20222c;
    --card-hover: #252835;
    --line: #2b2e3b;
    --text: #e4e5ea;
    --muted: #a3a8bb;
    --faint: #8a8fa4;  /* 4.5:1 or more on every surface, hover included */
    --run: #8be9fd;
    --ok: #50fa7b;
    --warn: #ffb86c;
    --you: #ff79c6;
    --bg-agent: #bd93f9;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }

  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 28px 32px 6px;
  }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
  .summary { display: flex; gap: 14px; flex-wrap: wrap; font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .summary b { font-weight: 600; }
  .summary .you b { color: var(--you); }
  .summary .run b { color: var(--run); }
  .summary .bg b { color: var(--bg-agent); }
  .summary .zero { color: var(--faint); }
  .summary .zero b { color: inherit; }
  .view { margin-left: auto; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .sort { display: flex; align-items: baseline; gap: 2px; font-family: var(--mono); font-size: 12px; color: var(--faint); }
  .sort span { margin-right: 6px; }
  .sort button { background: none; border: 1px solid transparent; border-radius: 6px; padding: 1px 7px; cursor: pointer; color: var(--muted); }
  .sort button:hover { color: var(--text); }
  .sort button[aria-pressed="true"] { color: var(--text); border-color: var(--line); background: var(--card); }
  .sort button:focus-visible { outline: 2px solid var(--run); outline-offset: 1px; }
  /* Queue a work item; shown only when server/serve.py serves the page. */
  .launch { display: flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 12px; color: var(--faint); }
  .launch[hidden] { display: none; }
  .launch select, .launch input, .launch button {
    font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px;
  }
  .launch select { max-width: 160px; }
  .launch #launch-max { color: var(--muted); }
  .launch input { width: 9ch; }
  .launch button { cursor: pointer; color: var(--run); }
  .launch button:disabled { cursor: default; color: var(--faint); }
  .launch :focus-visible { outline: 2px solid var(--run); outline-offset: 1px; }
  .launch output { color: var(--muted); white-space: nowrap; }
  .launch output.error { color: var(--you); }
  .ram:not([hidden]) + .status { margin-left: auto; }
  .status { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .status .dot {
    display: inline-block; width: 7px; height: 7px; border-radius: 50%;
    background: var(--ok); margin-right: 6px; vertical-align: 1px;
  }
  .status.error { color: var(--you); }
  .status.error .dot { background: var(--you); }

  /* The PC's memory: one line under the counts. Quiet until pressure is high. */
  /* Starts the strip's row, which the status line ends; gone with the strip. */
  .ram-break { flex-basis: 100%; height: 0; }
  .ram-break:has(+ .ram[hidden]) { display: none; }
  .ram {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: -4px 0 0 -6px; padding: 3px 6px;
    background: none; border: 0; border-radius: 6px; cursor: pointer; text-align: left;
    font-family: var(--mono); font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums;
  }
  .ram[hidden] { display: none; }
  .ram:hover { background: var(--card); color: var(--text); }
  .ram:focus-visible { outline: 2px solid var(--run); outline-offset: 1px; }
  .ram .k { color: var(--faint); }
  .ram .bar { display: flex; width: 168px; height: 6px; border-radius: 3px; overflow: hidden; background: var(--line); }
  .ram .bar i { display: block; height: 100%; }
  .ram .bar .c { background: var(--muted); }
  .ram .bar .o { background: color-mix(in srgb, var(--faint) 50%, var(--line)); }
  .ram b { font-weight: 600; color: var(--text); }
  .ram .sep { color: var(--faint); }
  .ram .hi, .ram .held { color: var(--warn); }
  .ram .hi b { color: inherit; }
  .ram.hot .bar .c { background: var(--warn); }
  .ram.hot .bar .o { background: color-mix(in srgb, var(--warn) 40%, var(--line)); }
  .ram.stale .bar { opacity: .45; }
  .ram.stale .when { color: var(--warn); }

  main { padding: 18px 32px 40px; }

  /* The queue: what's running for it, what waits, and what just finished. */
  .queue { margin-bottom: 16px; display: grid; gap: 2px; font-size: 12.5px; }
  .queue[hidden] { display: none; }
  .q {
    display: grid; grid-template-columns: 74px minmax(0, 160px) 70px minmax(0, 1fr) auto; gap: 12px; align-items: baseline;
    padding: 4px 8px; border-radius: 6px; color: var(--muted);
  }
  .q:hover { background: var(--card); }
  .q .st { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--faint); }
  .q.running .st { color: var(--run); }
  .q.queued .st { color: var(--warn); }
  .q.failed .st { color: var(--you); }
  .q .p { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .q .wi { font-family: var(--mono); color: var(--run); }
  .q .x { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: var(--mono); font-size: 11.5px; }
  .q .acts { display: flex; gap: 4px; }
  .q .acts button {
    font-family: var(--mono); font-size: 11px; background: none; border: 1px solid var(--line); border-radius: 5px;
    padding: 0 7px; cursor: pointer; color: var(--muted);
  }
  .q .acts button:hover { color: var(--text); border-color: var(--muted); }
  .q .acts button:focus-visible { outline: 2px solid var(--run); outline-offset: 1px; }
  .q.ended { opacity: .7; }
  .grid {
    display: grid; gap: 14px; align-items: start;
    grid-template-columns: repeat(auto-fill, minmax(min(330px, 100%), 1fr));
  }
  /* Groups: a header over each project's or work item's tiles. Grouping "none"
     is one section with its header hidden. */
  .group + .group { margin-top: 26px; }
  .group.collapsed + .group, .group + .group.collapsed { margin-top: 10px; }
  /* The bar holds the header, a button, and the "+" beside it: a button can't hold another. */
  .g-bar {
    display: flex; align-items: center; gap: 4px; margin-bottom: 12px;
    border-bottom: 1px solid var(--line); border-radius: 6px 6px 0 0;
  }
  .g-bar[hidden] { display: none; }
  .collapsed .g-bar { margin-bottom: 0; }
  .g-head {
    display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; flex: 1; min-width: 0;
    padding: 4px 4px 7px; background: none; border: 0; border-radius: 6px 6px 0 0;
    text-align: left; cursor: pointer; color: var(--muted);
  }
  .g-head:hover { color: var(--text); }
  .g-head:focus-visible, .g-new:focus-visible { outline: 2px solid var(--run); outline-offset: 1px; }
  .g-new {
    flex: none; width: 22px; height: 22px; padding: 0; margin-bottom: 3px; display: grid; place-items: center;
    background: none; border: 1px solid transparent; border-radius: 6px; color: var(--faint); cursor: pointer;
  }
  .g-new[hidden] { display: none; }
  .g-new:hover { color: var(--run); border-color: var(--line); background: var(--card); }
  .g-new:disabled { cursor: default; color: var(--faint); }
  .g-new svg { width: 10px; height: 10px; }
  .g-new path { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
  .g-head .chev {
    width: 10px; height: 10px; flex: none; align-self: center; color: var(--faint);
    transform: rotate(90deg); transition: transform .15s ease-out;
  }
  .collapsed .g-head .chev { transform: none; }
  .g-head:hover .chev { color: var(--text); }
  .chev path { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
  .g-name { font-weight: 600; font-size: 13px; color: var(--text); min-width: 0; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .g-extra { font-family: var(--mono); font-size: 11px; color: var(--faint); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .g-count { font-family: var(--mono); font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .g-head .summary { margin-left: auto; }
  /* A collapsed group hides its tiles, so it carries their alert instead. */
  .g-dot { display: none; width: 7px; height: 7px; border-radius: 50%; flex: none; align-self: center; background: var(--you); }
  .collapsed.you .g-dot { display: block; animation: pulse .9s ease-in-out infinite; }
  .collapsed.you .g-bar {
    border-bottom-color: var(--you);
    background: linear-gradient(to top, color-mix(in srgb, var(--you) 9%, transparent), transparent);
  }
  .group .grid[hidden] { display: none; }
  .empty-all { color: var(--faint); padding: 40px 0; text-align: center; }
  .empty-all code { font-family: var(--mono); color: var(--muted); }

  /* Tiles */
  .tile {
    position: relative; overflow: hidden; display: block; width: 100%; text-align: left;
    cursor: pointer; background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 14px 12px; animation: enter .35s ease both;
    transition: background .15s, border-color .3s, box-shadow .3s, opacity .3s;
  }
  .tile:hover { background: var(--card-hover); }
  .tile:focus-visible { outline: 2px solid var(--run); outline-offset: 2px; }
  /* The sweep moves with transform and the glow fades with opacity: both run on
     the compositor. Animating background-position or box-shadow repaints the
     tile on every frame. */
  .tile::before {
    content: ""; position: absolute; left: 0; top: 0; width: 50%; height: 2px; opacity: 0;
    background: linear-gradient(90deg, transparent, var(--accent, var(--run)), transparent);
    pointer-events: none;
  }
  .tile::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; opacity: 0; pointer-events: none;
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--you) 70%, transparent), inset 0 0 26px -8px color-mix(in srgb, var(--you) 45%, transparent);
  }
  .tile.s-running { border-color: color-mix(in srgb, var(--run) 30%, var(--line)); }
  .tile.s-running::before { opacity: 1; animation: sweep 1.8s linear infinite; }
  .tile.s-background { --accent: var(--bg-agent); border-color: color-mix(in srgb, var(--bg-agent) 25%, var(--line)); }
  .tile.s-background::before { opacity: .8; animation: sweep 3.6s linear infinite; }
  .tile.s-waiting {
    border-color: var(--you);
    box-shadow: 0 0 0 1px color-mix(in srgb, var(--you) 30%, transparent), 0 6px 22px -12px color-mix(in srgb, var(--you) 50%, transparent);
  }
  .tile.s-waiting::after { animation: glow 2.2s ease-in-out infinite; }
  .tile.s-idle { opacity: .9; }
  .tile.stale { opacity: .5; filter: saturate(.3); }
  .tile.blip { animation: enter .35s ease both, blip .7s ease-out; }

  .t-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .state-dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--faint); }
  .s-running .state-dot { background: var(--run); animation: pulse 1.4s ease-in-out infinite; }
  .s-background .state-dot { background: var(--bg-agent); animation: pulse 2.4s ease-in-out infinite; }
  .s-waiting .state-dot { background: var(--you); animation: pulse .9s ease-in-out infinite; }
  .s-idle .state-dot { background: var(--ok); }
  .project { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .branch { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  /* The terminal tab's name, so the right tab is easy to find. */
  .tab {
    min-width: 0; flex: 0 1 auto; padding: 1px 8px; border: 1px solid var(--line); border-radius: 5px;
    font-size: 11.5px; color: var(--text); background: var(--bg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .s-waiting .tab { border-color: color-mix(in srgb, var(--you) 55%, var(--line)); }
  .project { flex: none; max-width: 45%; }
  .branch { flex: 1 1 0; }
  .since { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; }
  .s-waiting .since { color: var(--you); }

  /* Every tile has the same fixed slots, so tiles are all one height and content
     changes between polls never reflow the grid. */
  .title { margin: 8px 0 2px; height: 22px; font-size: 15px; line-height: 22px; font-weight: 600; display: flex; gap: 8px; align-items: center; min-width: 0; }
  .title .tt { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .title .wi { font-family: var(--mono); color: var(--run); }
  .title .skill { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--muted); }
  .title .wi + .skill { margin-left: 8px; }
  .prompt { color: var(--muted); font-size: 12.5px; line-height: 1.5; height: 3em; margin: 2px 0 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .slot { margin-top: 10px; height: 78px; overflow: hidden; }

  .phase {
    display: inline-flex; align-items: center; gap: 6px; flex: none; margin-left: auto;
    font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    color: var(--run); background: color-mix(in srgb, var(--run) 12%, transparent);
    padding: 0 8px; line-height: 20px; border-radius: 999px;
  }
  .s-background .phase { color: var(--bg-agent); background: color-mix(in srgb, var(--bg-agent) 14%, transparent); }
  .done-badge {
    flex: none; margin-left: auto;
    font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase;
    color: var(--ok); background: color-mix(in srgb, var(--ok) 12%, transparent);
    padding: 0 8px; line-height: 20px; border-radius: 999px;
  }
  .done-badge + .phase { margin-left: 6px; }

  .ask {
    padding: 8px 10px; border-radius: 8px; font-size: 12.5px;
    color: var(--you); background: color-mix(in srgb, var(--you) 10%, transparent);
    border: 1px solid color-mix(in srgb, var(--you) 35%, transparent);
  }
  .ask b { font-weight: 600; }
  .ask .d { font-family: var(--mono); font-size: 11.5px; color: var(--text); overflow-wrap: anywhere; }
  .slot .ask { height: 100%; }
  .slot .ask .d { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  .activity { display: grid; gap: 3px; }
  .d-body .activity { margin-top: 10px; }
  .act { display: flex; gap: 8px; align-items: baseline; font-family: var(--mono); font-size: 11.5px; min-width: 0; }
  .act .who { color: var(--bg-agent); flex: none; }
  .act .what { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .act .t { margin-left: auto; color: var(--faint); flex: none; }
  .act.last .what { color: var(--muted); }

  .agents { margin-top: 10px; height: 22px; display: flex; gap: 5px; overflow: hidden; }
  .agent {
    display: inline-flex; align-items: center; gap: 5px; flex: none; font-family: var(--mono); font-size: 10.5px;
    padding: 2px 7px; border-radius: 5px; border: 1px solid var(--line); color: var(--muted);
  }
  .agent.running { color: var(--text); border-color: color-mix(in srgb, var(--bg-agent) 45%, var(--line)); }
  .agent.done { color: var(--ok); background: color-mix(in srgb, var(--ok) 8%, transparent); border-color: transparent; }
  .agent.failed { color: var(--you); border-color: color-mix(in srgb, var(--you) 40%, transparent); }
  .agent .spin {
    width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--bg-agent);
    border-right-color: transparent; animation: spin .8s linear infinite;
  }

  .t-foot { margin-top: 12px; display: flex; align-items: center; gap: 12px; font-family: var(--mono); font-size: 10.5px; color: var(--faint); }
  .prs { margin-left: auto; display: flex; gap: 6px; min-width: 0; overflow: hidden; }
  .pr {
    flex: none; color: var(--run); padding: 1px 6px; border-radius: 4px; cursor: pointer;
    background: color-mix(in srgb, var(--run) 10%, transparent);
  }
  .pr:hover { text-decoration: underline; }
  .pr-list a { color: var(--run); }
  .meter { flex: 1; max-width: 120px; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--muted); border-radius: 2px; transition: width .6s ease; }
  .meter.hot i { background: var(--warn); }
  .countdown.low { color: var(--warn); }
  .sched { color: var(--muted); white-space: nowrap; }
  .mem { display: inline-flex; align-items: center; gap: 4px; }
  .mem svg { width: 36px; height: 10px; overflow: visible; }
  .mem polyline { fill: none; stroke: currentColor; stroke-width: 1.2; vector-effect: non-scaling-stroke; }
  .mem.hot { color: var(--warn); }

  /* Ended & stale */
  details.past { margin-top: 32px; }
  details.past summary { cursor: pointer; color: var(--muted); font-size: 13px; list-style: none; }
  details.past summary::before { content: "▸ "; color: var(--faint); }
  details.past[open] summary::before { content: "▾ "; }
  .rows { margin-top: 10px; display: grid; gap: 4px; }
  .row {
    display: grid; grid-template-columns: 160px 1fr auto; gap: 14px; align-items: baseline; width: 100%;
    text-align: left; background: none; border: 0; border-radius: 6px; padding: 6px 8px; cursor: pointer;
    font-size: 12.5px; color: var(--muted);
  }
  .row:hover { background: var(--card); color: var(--text); }
  .row .p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .row .x { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .w { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; }

  /* Drawer */
  .scrim { position: fixed; inset: 0; background: rgba(5, 6, 10, .55); opacity: 0; pointer-events: none; transition: opacity .2s; }
  .drawer {
    position: fixed; top: 0; right: 0; bottom: 0; width: min(720px, 100vw); overflow-y: auto;
    background: var(--panel); border-left: 1px solid var(--line);
    transform: translateX(100%); transition: transform .25s ease;
  }
  .open .scrim { opacity: 1; pointer-events: auto; }
  .open .drawer { transform: none; }
  .d-head { position: sticky; top: 0; z-index: 1; background: var(--panel); padding: 20px 24px 14px; border-bottom: 1px solid var(--line); }
  .d-head h2 { margin: 2px 40px 4px 0; font-size: 16px; font-weight: 600; line-height: 1.35; }
  .close {
    position: absolute; top: 16px; right: 16px; width: 32px; height: 32px; border-radius: 8px;
    border: 1px solid var(--line); background: none; cursor: pointer; color: var(--muted); font-size: 18px; line-height: 1;
  }
  .close:hover { color: var(--text); border-color: var(--muted); }
  .d-body { padding: 18px 24px 60px; }
  .d-body h3 { margin: 22px 0 8px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); }
  .d-body h3:first-child { margin-top: 0; }
  .kv { display: grid; grid-template-columns: 110px 1fr; gap: 4px 12px; font-size: 12.5px; }
  .kv dt { color: var(--faint); }
  .kv dd { margin: 0; font-family: var(--mono); font-size: 12px; overflow-wrap: anywhere; }
  .quote { white-space: pre-wrap; font-size: 13px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .copy {
    margin-top: 8px; font-family: var(--mono); font-size: 11.5px; background: var(--card); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 10px; cursor: pointer; color: var(--muted);
  }
  .copy:hover { color: var(--text); border-color: var(--muted); }
  table.ag { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.ag td { border-top: 1px solid var(--line); padding: 6px 8px 6px 0; vertical-align: top; }
  table.ag .ty { font-family: var(--mono); white-space: nowrap; }
  table.ag .st { font-family: var(--mono); font-size: 11px; white-space: nowrap; }
  table.ag .lt { font-family: var(--mono); font-size: 11px; color: var(--faint); overflow-wrap: anywhere; }
  .timeline { display: grid; gap: 2px; }
  .ev { display: grid; grid-template-columns: 62px 70px 1fr; gap: 10px; font-size: 12px; align-items: baseline; }
  .ev .tm { font-family: var(--mono); font-size: 11px; color: var(--faint); }
  .ev .k { font-family: var(--mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
  .ev .tx { overflow-wrap: anywhere; }
  .ev .tx .ag { color: var(--bg-agent); font-family: var(--mono); font-size: 11px; margin-right: 6px; }
  .ev.prompt .k { color: var(--run); } .ev.prompt .tx { color: var(--text); font-weight: 500; }
  .ev.waiting .k, .ev.error .k { color: var(--you); }
  .ev.agent .k { color: var(--bg-agent); }
  .ev.skill .k { color: var(--warn); }
  .ev.tool .tx { font-family: var(--mono); font-size: 11.5px; color: var(--muted); }
  /* The memory drawer's sessions, biggest first. */
  .mem-rows { display: grid; gap: 1px; }
  .mrow {
    display: grid; grid-template-columns: 64px 56px minmax(0, 1fr) auto; gap: 12px; align-items: center; width: 100%;
    text-align: left; background: none; border: 0; border-radius: 6px; padding: 5px 8px; margin: 0 -8px; cursor: pointer;
    font-size: 12.5px; color: var(--muted); box-sizing: content-box;
  }
  .mrow:hover { background: var(--card); color: var(--text); }
  .mrow:focus-visible { outline: 2px solid var(--run); outline-offset: -2px; }
  .mrow .n { font-family: var(--mono); font-size: 12px; color: var(--text); text-align: right; font-variant-numeric: tabular-nums; }
  .mrow .share { height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .mrow .share i { display: block; height: 100%; background: var(--muted); }
  .mrow.big .n { color: var(--warn); }
  .mrow.big .share i { background: var(--warn); }
  .mrow .p { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text); }
  .mrow .p span { color: var(--faint); margin-left: 6px; }
  .mrow .w { font-family: var(--mono); font-size: 11px; color: var(--faint); white-space: nowrap; }
  .mrow .w.you { color: var(--you); }
  .mrow .w.run { color: var(--run); }
  .note { margin: 10px 0 0; font-size: 12px; color: var(--faint); }

  @keyframes sweep { from { transform: translateX(-50%); } to { transform: translateX(150%); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes enter { from { opacity: 0; transform: translateY(6px) scale(.985); } }
  @keyframes glow { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }
  @keyframes blip { 0% { background: color-mix(in srgb, var(--run) 10%, var(--card)); } 100% { background: var(--card); } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  @media (max-width: 640px) {
    header { padding: 20px 16px 4px; }
    .view { margin-left: 0; }
    .status { margin-left: auto; }
    main { padding: 14px 16px 32px; }
    .grid { grid-template-columns: minmax(0, 1fr); }
    .q { grid-template-columns: 64px minmax(0, 1fr) auto; }
    .q .wi, .q .x { display: none; }
    .row { grid-template-columns: 1fr auto; }
    .row .x { display: none; }
    .ram .bar { width: 96px; }
    .mrow { grid-template-columns: 56px minmax(0, 1fr) auto; }
    .mrow .share { display: none; }
    .d-head { padding: 16px; }
    .d-body { padding: 16px 16px 48px; }
    .kv { grid-template-columns: 90px 1fr; }
    .ev { grid-template-columns: 52px 1fr; }
    .ev .k { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1>Sessions</h1>
  <div class="summary" id="summary"></div>
  <form class="launch" id="launch" hidden>
    <select id="launch-cwd" aria-label="Project" required></select>
    <select id="launch-max" aria-label="Queued sessions at once in this project" title="queued sessions at once in this project"></select>
    <input id="launch-id" aria-label="Work item number" placeholder="#1234" inputmode="numeric" pattern="#?\d{1,9}" required>
    <button id="launch-go">queue</button>
    <button type="button" id="launch-new" title="open an empty session in this project now, in a new terminal">new session</button>
    <output id="launch-out" aria-live="polite"></output>
  </form>
  <div class="view">
    <div class="sort" role="group" aria-label="Group sessions">
      <span>group</span>
      <button data-group-by="none" aria-pressed="true">none</button>
      <button data-group-by="project" aria-pressed="false">project</button>
      <button data-group-by="workItem" aria-pressed="false">work item</button>
    </div>
    <div class="sort" role="group" aria-label="Sort sessions">
      <span>sort</span>
      <button data-sort="started" aria-pressed="true">started</button>
      <button data-sort="project" aria-pressed="false">project</button>
      <button data-sort="waiting" aria-pressed="false">needs you first</button>
    </div>
  </div>
  <div class="ram-break"></div>
  <button class="ram" id="ram" data-memory hidden aria-haspopup="dialog"></button>
  <div class="status" id="status">connecting…</div>
</header>
<main>
  <section class="queue" id="queue" aria-label="Queue" hidden></section>
  <div id="groups"></div>
  <div id="empty"></div>
  <details class="past" id="past" hidden>
    <summary id="past-summary"></summary>
    <div class="rows" id="rows"></div>
  </details>
</main>

<div id="overlay">
  <div class="scrim" data-close></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title">
    <div class="d-head">
      <div class="branch" id="d-sub"></div>
      <h2 id="d-title"></h2>
      <button class="close" data-close aria-label="Close">×</button>
    </div>
    <div class="d-body" id="d-body"></div>
  </aside>
</div>

<script>
const POLL_MS = 2000
const HIDDEN_POLL_MS = 15_000    // tab not visible: only the title and favicon update
const STALE_MS = 20_000          // no heartbeat for this long: the session is gone
const HIDE_AFTER_MS = 24 * 3600_000
const RECHECK_STALE_MS = 30_000  // how often to refetch a session without heartbeat
const RECHECK_GONE_MS = 5 * 60_000  // ...and one hidden for being older than HIDE_AFTER_MS

// Phases by subagent type, newest running agent first, then by running skill.
// Your own rules go in phases.json next to this page and are tried first:
// [{ "agent": "^my-agent$", "phase": "Implementing" }, { "skill": "deploy", "phase": "Deploying" }]
const DEFAULT_PHASES = [
  { agent: /review/i, phase: 'Reviewing' },
  { agent: /^(Explore|Plan)$/, phase: 'Exploring' },
  { agent: /^general-purpose$/, phase: 'Working' },
  { skill: /review/i, phase: 'Reviewing' },
]
let phases = DEFAULT_PHASES
const STATE_WORD = { waiting: 'needs you', running: 'running', background: 'agents running', idle: 'idle', ended: 'ended' }

const $ = (id) => document.getElementById(id)
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])

let sessions = []
const endedCache = new Map()   // file -> board of an ended session (never changes again)
// file -> { board, until }: a session that stopped without ending (crashed, killed).
// It may still come back, so it's refetched now and then rather than every poll.
const quietCache = new Map()
const tiles = new Map()        // sessionId -> { el, html, lastEvent }
let sortBy = 'started'
try { sortBy = localStorage.getItem('sessionBoard.sort') || sortBy } catch {}
let groupBy = 'none'
try { groupBy = localStorage.getItem('sessionBoard.group') || groupBy } catch {}
// "<groupBy>:<key>" -> true for each group you collapsed, so it stays collapsed
// while its sessions come and go.
let collapsed = {}
try { collapsed = JSON.parse(localStorage.getItem('sessionBoard.collapsed') || '{}') || {} } catch {}
const sections = new Map()     // "<groupBy>:<key>" -> { el, head, grid, html }
let openId = null
let openHtml = ''

async function fetchText(url) {
  const res = await fetch(url, { cache: 'no-store' })
  if (!res.ok) throw new Error(`${url}: HTTP ${res.status}`)
  return res.text()
}

// python -m http.server serves an HTML index for directories; read its links.
async function loadSessions() {
  let listing
  try {
    listing = await fetchText('sessions/')
  } catch (err) {
    if (/HTTP 404/.test(err.message)) return []
    throw err
  }
  const doc = new DOMParser().parseFromString(listing, 'text/html')
  const files = [...doc.querySelectorAll('a')]
    .map((a) => decodeURIComponent(a.getAttribute('href')))
    .filter((h) => h.endsWith('.json'))
  const boards = await Promise.all(files.map(async (f) => {
    if (endedCache.has(f)) return endedCache.get(f)
    const quiet = quietCache.get(f)
    if (quiet && Date.now() < quiet.until) return quiet.board
    try {
      const board = JSON.parse(await fetchText('sessions/' + encodeURIComponent(f)))
      const age = Date.now() - board.updatedAt
      if (board.state === 'ended') endedCache.set(f, board)
      else if (age > HIDE_AFTER_MS) quietCache.set(f, { board, until: Date.now() + RECHECK_GONE_MS })
      else if (age > STALE_MS) quietCache.set(f, { board, until: Date.now() + RECHECK_STALE_MS })
      else quietCache.delete(f)
      return board
    } catch {
      return quiet?.board ?? null  // mid-write or malformed: next poll
    }
  }))
  return boards.filter(Boolean)
}

// ---- Formatting -----------------------------------------------------------

function dur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000))
  if (s < 60) return `${s}s`
  const m = Math.floor(s / 60)
  if (m < 60) return `${m}m ${String(s % 60).padStart(2, '0')}s`
  const h = Math.floor(m / 60)
  if (h < 24) return `${h}h ${String(m % 60).padStart(2, '0')}m`
  return `${Math.floor(h / 24)}d ${h % 24}h`
}
// Left empty so a tile's HTML only changes when its data does; tick() fills it in.
const live = (since, prefix = '') => `<span data-since="${since}" data-prefix="${esc(prefix)}"></span>`
const clock = (t) => new Date(t).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })

// Counts down to `until`; tick() fills it in and swaps to `expired` once past.
const countdown = (until, prefix, expired) =>
  `<span class="countdown" data-until="${until}" data-prefix="${esc(prefix)}" data-expired="${esc(expired)}"></span>`

// The main thread's prompt cache, while nothing keeps it warm. Sessions that
// haven't reported a TTL yet are assumed to have the default hour.
const CACHE_TTL_MS = { '5m': 5 * 60_000, '1h': 60 * 60_000 }
const CACHE_LOW_MS = 2 * 60_000  // the countdown turns orange from here
function cacheExpiry(s) {
  if (!s.cache) return null
  const ttl = s.cache.ttl || '1h'
  return { until: s.cache.at + CACHE_TTL_MS[ttl], ttl, isAssumed: !s.cache.ttl }
}
function cacheHtml(s) {
  const c = cacheExpiry(s)
  if (!c || s.state === 'running') return ''
  const title = `prompt cache ${c.isAssumed ? 'assumed to expire' : 'expires'} ${clock(c.until)} (${c.ttl} TTL${c.isAssumed ? ', assumed' : ''})`
  return `<span title="${esc(title)}">${countdown(c.until, `cache ${c.isAssumed ? '≈' : ''}`, 'cache cold')}</span>`
}

// The session's claude.exe plus what it started, sampled once a minute.
const MEM_HOT_MB = 1024  // the tile's memory turns orange from here
const memTotal = (m) => m.mb + m.childMb
const mb = (n) => (n >= 1024 ? `${(n / 1024).toFixed(1)} GB` : `${Math.round(n)} MB`)
function sparkline(history) {
  if (history.length < 2) return ''
  const t0 = history[0][0], t1 = history.at(-1)[0]
  const lo = Math.min(...history.map((h) => h[1])), hi = Math.max(...history.map((h) => h[1]))
  const pts = history.map(([t, v]) => `${(((t - t0) / (t1 - t0 || 1)) * 36).toFixed(1)},${(10 - ((v - lo) / (hi - lo || 1)) * 10).toFixed(1)}`)
  return `<svg viewBox="0 0 36 10" preserveAspectRatio="none"><polyline points="${pts.join(' ')}"/></svg>`
}
// Growth of claude.exe over the samples kept, or '' with fewer than two.
function memTrend(m) {
  if (m.history.length < 2) return ''
  const [t0, v0] = m.history[0], [t1, v1] = m.history.at(-1)
  return `${v1 >= v0 ? '+' : '−'}${mb(Math.abs(v1 - v0))} in ${dur(t1 - t0)}`
}
function memHtml(s) {
  const m = s.memory
  if (!m) return ''
  const trend = memTrend(m)
  const title = `claude.exe ${mb(m.mb)} (${mb(m.wsMb)} in RAM) + ${mb(m.childMb)} started by it${trend ? `\nclaude.exe ${trend}` : ''}`
  return `<span class="mem ${memTotal(m) >= MEM_HOT_MB ? 'hot' : ''}" title="${esc(title)}">${sparkline(m.history)}${mb(memTotal(m))}</span>`
}

// ---- The PC's memory --------------------------------------------------------

// The strip turns orange at the marks where server/serve.py holds the queue
// (RAM_HOLD and COMMIT_HOLD); it resumes below RAM_RELEASE and COMMIT_RELEASE.
const RAM_HIGH_PCT = 90, COMMIT_HIGH_PCT = 85
const RAM_RELEASE_PCT = 85, COMMIT_RELEASE_PCT = 80
const MACHINE_STALE_MS = 180_000  // a sample older than this is shown as stale
const MEMORY_DRAWER = '@memory'   // openId of the memory drawer, never a session id
const pct = (part, whole) => Math.round((100 * part) / whole)
const gb = (n) => (n / 1024).toFixed(1)
const liveSessions = () => sessions.filter((s) => s.state !== 'ended' && !isStale(s))

// Every session samples the whole PC; the newest sample wins.
function machineOf() {
  let m = null
  for (const s of sessions) if (s.machine && (!m || s.machine.at > m.at)) m = s.machine
  return m
}

function machineView() {
  const m = machineOf()
  if (!m) return null
  const withMem = liveSessions().filter((s) => s.memory)
  const claude = withMem.reduce((sum, s) => sum + memTotal(s.memory), 0)
  const ram = pct(m.ramMb, m.ramTotalMb)
  const commit = pct(m.commitMb, m.commitLimitMb)
  return {
    m, withMem, claude, ram, commit,
    ramHi: ram >= RAM_HIGH_PCT, commitHi: commit >= COMMIT_HIGH_PCT,
    stale: Date.now() - m.at > MACHINE_STALE_MS,
    held: queueServed ? queue?.held || null : null,
  }
}

function renderMemory() {
  const v = machineView()
  const el = $('ram')
  el.hidden = !v
  if (!v) return
  const { m, claude, ram, commit } = v
  // Claude's sessions count private memory, which can exceed what sits in RAM.
  const inRam = Math.min(claude, m.ramMb)
  const cls = `ram${v.ramHi || v.commitHi ? ' hot' : ''}${v.stale ? ' stale' : ''}`
  const sep = '<span class="sep">·</span>'
  const html = `<span class="k">RAM</span>
    <span class="bar"><i class="c" style="width:${((100 * inRam) / m.ramTotalMb).toFixed(1)}%"></i><i class="o" style="width:${((100 * (m.ramMb - inRam)) / m.ramTotalMb).toFixed(1)}%"></i></span>
    <span class="${v.ramHi ? 'hi' : ''}"><b>${gb(m.ramMb)}</b> / ${gb(m.ramTotalMb)} GB</span>${sep}
    <span class="${v.commitHi ? 'hi' : ''}">commit <b>${commit}%</b></span>${sep}
    <span>claude <b>${mb(claude)}</b> in ${v.withMem.length} session${v.withMem.length === 1 ? '' : 's'}</span>
    ${v.held ? `${sep}<span class="held">queue held</span>` : ''}
    ${v.stale ? `${sep}<span class="when">as of ${esc(clock(m.at))}</span>` : ''}`
  if (el.className !== cls) el.className = cls
  if (el.dataset.html !== html) {
    el.innerHTML = html
    el.dataset.html = html
    el.setAttribute('aria-label', `Memory: RAM ${ram}% of ${gb(m.ramTotalMb)} GB, commit ${commit}%, Claude sessions ${mb(claude)}${v.held ? ', queue held' : ''}. Show sessions by memory.`)
  }
}

function memoryDrawerHtml() {
  const v = machineView()
  if (!v) return '<p class="note">No memory sample yet. Sessions sample it once a minute on Windows.</p>'
  const { m, claude, ram, commit } = v
  // Biggest first; at equal size, the session idle longest, as the easiest to close.
  const order = (s) => (s.state === 'idle' ? 0 : 1)
  const list = [...v.withMem].sort((a, b) => memTotal(b.memory) - memTotal(a.memory) || order(a) - order(b) || a.stateSince - b.stateSince)
  const top = list.length ? memTotal(list[0].memory) : 1
  const stateCls = { waiting: 'you', running: 'run', background: 'run' }
  const rows = list.map((s) => {
    const total = memTotal(s.memory)
    const what = s.workItem ? `#${s.workItem}` : s.tabTitle || (s.prompt ? firstSentence(s.prompt) : '')
    return `<button class="mrow${total >= MEM_HOT_MB ? ' big' : ''}" data-session="${esc(s.sessionId)}">
      <span class="n">${mb(total)}</span>
      <span class="share"><i style="width:${((100 * total) / top).toFixed(1)}%"></i></span>
      <span class="p">${esc(projectOf(s))}${what ? `<span>${esc(what)}</span>` : ''}</span>
      <span class="w ${stateCls[s.state] || ''}">${esc(STATE_WORD[s.state])}${s.state === 'idle' ? ` ${live(s.stateSince)}` : ''}</span>
    </button>`
  }).join('')
  return `<h3>Pressure</h3><dl class="kv">
    <dt>RAM in use</dt><dd${v.ramHi ? ' style="color:var(--warn)"' : ''}>${gb(m.ramMb)} of ${gb(m.ramTotalMb)} GB · ${ram}%</dd>
    <dt>commit</dt><dd${v.commitHi ? ' style="color:var(--warn)"' : ''}>${gb(m.commitMb)} of ${gb(m.commitLimitMb)} GB · ${commit}% (the limit is RAM plus the page file)</dd>
    <dt>Claude</dt><dd>${mb(claude)} in ${v.withMem.length} session${v.withMem.length === 1 ? '' : 's'} · ${pct(claude, m.ramTotalMb)}% of RAM</dd>
    <dt>sampled</dt><dd${v.stale ? ' style="color:var(--warn)"' : ''}>${esc(clock(m.at))}${v.stale ? ' · no newer sample' : ''}</dd>
    ${queueServed ? `<dt>queue</dt><dd${v.held ? ' style="color:var(--warn)"' : ''}>${v.held ? `holding new starts (${esc(v.held)})` : 'starts new items'}</dd>` : ''}
  </dl>
  ${queueServed ? `<p class="note">The queue holds new starts at ${RAM_HIGH_PCT}% RAM or ${COMMIT_HIGH_PCT}% commit and resumes once both are below ${RAM_RELEASE_PCT}% and ${COMMIT_RELEASE_PCT}%.</p>` : ''}
  <h3>Sessions by memory</h3>
  ${rows ? `<div class="mem-rows">${rows}</div>` : '<p class="note">No live session has a memory sample yet.</p>'}
  <p class="note">Each session's claude.exe plus everything it started, in private memory, sampled once a minute.</p>`
}

// Jobs that will wake the session, soonest first; those with no next time last.
const cronsOf = (s) => [...(s.crons || [])].sort((a, b) => (a.nextAt ?? Infinity) - (b.nextAt ?? Infinity))
// A job's next time: the clock today, with the weekday on any other day.
const day = (t) => new Date(t).toLocaleString([], new Date(t).toDateString() === new Date().toDateString()
  ? { hour: '2-digit', minute: '2-digit' }
  : { weekday: 'short', hour: '2-digit', minute: '2-digit' })
const cronLine = (c) => `${c.human} · ${c.nextAt ? `next ${day(c.nextAt)}` : 'no next time'}${c.recurring ? '' : ' (once)'}\n${c.prompt}`
function schedHtml(s) {
  const crons = cronsOf(s)
  const next = crons[0]
  if (!next) return ''
  const title = crons.map(cronLine).join('\n\n')
  const more = crons.length > 1 ? ` +${crons.length - 1}` : ''
  return `<span class="sched" title="${esc(title)}">⏱ ${next.nextAt ? countdown(next.nextAt, '', 'due') : esc(next.human)}${more}</span>`
}

const isStale = (s) => s.state !== 'ended' && Date.now() - s.updatedAt > STALE_MS
const projectOf = (s) => s.repo?.name || s.project || s.cwd
const shortModel = (m) => (m || '').replace(/^claude-/, '').replace(/\[.*\]$/, '')

function phaseOf(s) {
  const running = s.agents.filter((a) => a.status === 'running').sort((a, b) => b.since - a.since)
  for (const a of running) for (const p of phases) if (p.agent?.test(a.type)) return p.phase
  if (s.state === 'running' && s.activeSkill) for (const p of phases) if (p.skill?.test(s.activeSkill)) return p.phase
  return running[0]?.type ?? null
}

// phases.json is optional; a missing or broken file leaves the defaults.
async function loadPhases() {
  let rules
  try {
    rules = JSON.parse(await fetchText('phases.json'))
  } catch {
    return
  }
  if (!Array.isArray(rules)) return
  const own = []
  for (const r of rules) {
    try {
      if (typeof r?.phase !== 'string' || (!r.agent && !r.skill)) continue
      own.push({
        phase: r.phase,
        agent: r.agent ? new RegExp(r.agent, 'i') : null,
        skill: r.skill ? new RegExp(r.skill, 'i') : null,
      })
    } catch {}  // a bad regex skips that rule only
  }
  phases = [...own, ...DEFAULT_PHASES]
}

const prName = (p) => `${p.host === 'github' ? '#' : '!'}${p.number}`

const firstSentence = (p) => p.split(/(?<=[.?!])\s|\n/)[0].slice(0, 90)

function titleOf(s) {
  if (s.workItem) {
    return `<span class="wi">#${esc(s.workItem)}</span>${s.skill ? `<span class="skill">${esc(s.skill.name)}</span>` : ''}`
  }
  if (s.skill) return `<span class="skill" style="font-size:14px;color:var(--text)">/${esc(s.skill.name)}</span>`
  if (s.prompt) return esc(firstSentence(s.prompt))
  return '<span style="color:var(--faint)">No prompt yet</span>'
}

// ---- Tiles ----------------------------------------------------------------

function tileHtml(s) {
  const stale = isStale(s)
  // Two axes: the activity (state dot, phase) and the task, which only the
  // model sets with board_status. Done stands through follow-up prompts.
  const phase = s.done && s.state === 'idle' ? null : phaseOf(s)
  const after = s.done ? s.events.filter((e) => e.kind === 'prompt' && e.t > s.done.at).length : 0
  const done = s.done
    ? `<span class="done-badge" title="said it was done ${esc(clock(s.done.at))}${s.done.note ? `: ${esc(s.done.note)}` : ''}">✓ Done${after ? ` · +${after}` : ''}</span>`
    : ''
  const parts = []
  parts.push(`
    <div class="t-top">
      <span class="state-dot"></span>
      <span class="project">${esc(projectOf(s))}</span>
      ${s.tabTitle ? `<span class="tab" title="terminal tab: ${esc(s.tabTitle)}">${esc(s.tabTitle)}</span>` : ''}
      ${s.branch ? `<span class="branch">${esc(s.branch)}</span>` : ''}
      <span class="since">${stale ? `no heartbeat ${live(s.updatedAt)}` : live(s.stateSince, STATE_WORD[s.state] + ' ')}</span>
    </div>
    <div class="title"><span class="tt">${titleOf(s)}</span>${done}${phase ? `<span class="phase">${esc(phase)}</span>` : ''}</div>`)
  // The title already shows the prompt's first sentence when there's no work item or skill.
  const promptText = s.workItem || s.skill ? s.prompt : s.prompt?.slice(firstSentence(s.prompt).length).trim()
  parts.push(`<p class="prompt">${esc(promptText)}</p>`)

  // One fixed slot: the question when the session needs you, otherwise what it's doing.
  let slot = ''
  if (s.waiting) {
    const word = { question: 'Has a question', plan: 'Plan to approve' }[s.waiting.kind]
    slot = `<div class="ask"><b>${word}</b> · ${live(s.waiting.since)}<div class="d">${esc(s.waiting.detail)}</div></div>`
  } else {
    const nameOf = (id) => s.agents.find((a) => a.agentId === id)?.type
    const acts = [...s.tools].sort((a, b) => (a.agentId ? 1 : 0) - (b.agentId ? 1 : 0) || a.since - b.since).slice(0, 4)
    if (acts.length) {
      slot = `<div class="activity">${acts.map((t) => `
        <div class="act">${t.agentId ? `<span class="who">${esc(nameOf(t.agentId) || 'agent')}</span>` : ''}
          <span class="what">${esc(t.tool)}${t.summary ? ` · ${esc(t.summary)}` : ''}</span>
          <span class="t">${live(t.since)}</span></div>`).join('')}</div>`
    } else {
      const last = [...s.events].reverse().find((e) => e.kind !== 'session')
      if (last) slot = `<div class="activity"><div class="act last"><span class="what">${esc(last.text)}</span><span class="t">${live(last.t)} ago</span></div></div>`
    }
  }
  parts.push(`<div class="slot">${slot}</div>`)

  // One line of agents, running first so they're never the ones clipped.
  const running = s.agents.filter((a) => a.status === 'running' || a.status === 'idle')
  const recent = s.agents.filter((a) => a.status === 'done' || a.status === 'failed').slice(-Math.max(0, 6 - running.length)).reverse()
  parts.push(`<div class="agents">${[...running, ...recent].map((a) => `
    <span class="agent ${a.status}" title="${esc(a.description)}${a.lastTool ? '\n' + esc(a.lastTool) : ''}">
      ${a.status === 'running' ? '<span class="spin"></span>' : a.status === 'done' ? '✓' : a.status === 'failed' ? '✕' : '…'}
      ${esc(a.type)}</span>`).join('')}</div>`)

  const pct = s.context?.percent
  parts.push(`
    <div class="t-foot">
      ${pct != null ? `<span class="meter ${pct > 75 ? 'hot' : ''}" title="context ${Math.round(pct)}%"><i style="width:${Math.min(100, pct)}%"></i></span><span>${Math.round(pct)}%</span>` : ''}
      ${s.costUsd != null ? `<span>$${s.costUsd.toFixed(2)}</span>` : ''}
      ${memHtml(s)}
      ${cacheHtml(s)}
      ${schedHtml(s)}
      <span>${s.turns} turn${s.turns === 1 ? '' : 's'}</span>
      ${s.model ? `<span>${esc(shortModel(s.model))}</span>` : ''}
      ${s.prs?.length ? `<span class="prs">${[...s.prs].reverse().map((p) => `
        <span class="pr" data-href="${esc(p.url)}" title="${esc(p.repo)} ${prName(p)}">PR ${prName(p)}</span>`).join('')}</span>` : ''}
    </div>`)
  return parts.join('')
}

// ---- Groups ---------------------------------------------------------------

const STATE_BITS = [['waiting', 'you', 'need you'], ['running', 'run', 'running'], ['background', 'bg', 'background'], ['idle', '', 'idle']]
const countIn = (list, st) => list.filter((s) => s.state === st).length
const byName = (a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' })

// The sessions split into groups, each still in sort order. Groups are ordered
// by name, never by activity, so they keep their places between polls.
function groupsOf(active) {
  if (groupBy === 'none') return [{ key: '', list: active }]
  const keyOf = groupBy === 'workItem' ? (s) => s.workItem || '' : projectOf
  const byKey = new Map()
  for (const s of active) {
    const k = keyOf(s)
    if (!byKey.has(k)) byKey.set(k, [])
    byKey.get(k).push(s)
  }
  const groups = [...byKey].map(([key, list]) => ({ key, list }))
  if (groupBy === 'workItem') {
    // Work items by number; sessions without one last.
    return groups.sort((a, b) => (!a.key) - (!b.key) || Number(a.key) - Number(b.key) || byName(a.key, b.key))
  }
  return groups.sort((a, b) => byName(a.key, b.key))
}

function groupHeadHtml(g) {
  const name = groupBy === 'workItem' ? (g.key ? `#${g.key}` : 'No work item') : g.key
  // A work item's projects, since one can span several repos.
  const extra = groupBy === 'workItem' ? [...new Set(g.list.map(projectOf))].sort(byName).join(', ') : ''
  const bits = STATE_BITS.map(([st, c, w]) => {
    const n = countIn(g.list, st)
    return n ? `<span class="${c}"><b>${n}</b> ${st === 'waiting' && n === 1 ? 'needs you' : w}</span>` : ''
  }).join('')
  return `<svg class="chev" viewBox="0 0 10 10" aria-hidden="true"><path d="M3.5 2 6.5 5 3.5 8"/></svg>
    <span class="g-dot"></span>
    <span class="g-name" title="${esc(name)}">${esc(name)}</span>
    ${extra ? `<span class="g-extra">${esc(extra)}</span>` : ''}
    <span class="g-count">${g.list.length}</span>
    <span class="summary">${bits}</span>`
}

function setGroup(by) {
  groupBy = by
  try { localStorage.setItem('sessionBoard.group', by) } catch {}
  markSort()
  render()
}
function toggleGroup(id) {
  if (collapsed[id]) delete collapsed[id]
  else collapsed[id] = true
  try { localStorage.setItem('sessionBoard.collapsed', JSON.stringify(collapsed)) } catch {}
  render()
}

function render() {
  const now = Date.now()
  const active = sessions.filter((s) => s.state !== 'ended' && !isStale(s))
  const past = sessions.filter((s) => (s.state === 'ended' || isStale(s)) && now - s.updatedAt < HIDE_AFTER_MS)
  // Never sort on heartbeats or busy/idle: they change every few seconds and
  // reshuffled the grid on every poll. Every order ends on start time, oldest
  // first, so new sessions append and a tile otherwise keeps its place.
  const byStart = (a, b) => a.startedAt - b.startedAt || (a.sessionId < b.sessionId ? -1 : 1)
  const sorts = {
    started: byStart,
    project: (a, b) => byName(projectOf(a), projectOf(b)) || byStart(a, b),
    // Moves a tile only when a session starts or stops needing you.
    waiting: (a, b) => (b.state === 'waiting') - (a.state === 'waiting') || byStart(a, b),
  }
  active.sort(sorts[sortBy] || byStart)

  // Summary: always all four counts, so the header doesn't shift either.
  const waiting = countIn(active, 'waiting')
  document.title = waiting ? `(${waiting}) Session Board` : 'Session Board'
  setFavicon(waiting ? 'waiting' : 'ok')
  // A background tab keeps its alert (title and favicon) and skips the rest.
  if (document.hidden) return
  const summary = STATE_BITS.map(([st, c, w]) => {
    const n = countIn(active, st)
    return `<span class="${c}${n ? '' : ' zero'}"><b>${n}</b> ${w}</span>`
  }).join('')
  if ($('summary').dataset.html !== summary) { $('summary').innerHTML = summary; $('summary').dataset.html = summary }
  renderMemory()

  // Groups, keyed like tiles so polls never rebuild them. Tiles are placed first
  // and unused sections removed after, so a tile that changes group just moves.
  const groups = groupsOf(active)
  const container = $('groups')
  groups.forEach((g, i) => {
    const id = `${groupBy}:${g.key}`
    let sec = sections.get(id)
    if (!sec) {
      const el = document.createElement('section')
      el.className = 'group'
      el.innerHTML = `<div class="g-bar"><button class="g-head"></button><button class="g-new" hidden>
        <svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1v8M1 5h8"/></svg></button></div><div class="grid"></div>`
      const bar = el.firstChild
      sec = { el, bar, head: bar.firstChild, add: bar.lastChild, grid: el.lastChild, html: '' }
      sec.head.dataset.groupToggle = id
      sections.set(id, sec)
    }
    const isCollapsed = groupBy !== 'none' && !!collapsed[id]
    sec.el.classList.toggle('collapsed', isCollapsed)
    sec.el.classList.toggle('you', countIn(g.list, 'waiting') > 0)
    sec.bar.hidden = groupBy === 'none'
    sec.head.setAttribute('aria-expanded', String(!isCollapsed))
    const project = groupBy === 'project' ? projectFolder(g.list) : null
    sec.add.hidden = !project
    if (project && sec.add.dataset.newSession !== project.path) {
      sec.add.dataset.newSession = project.path
      sec.add.title = `new session in ${project.name}`
      sec.add.setAttribute('aria-label', sec.add.title)
    }
    sec.grid.hidden = isCollapsed
    const html = groupBy === 'none' ? '' : groupHeadHtml(g)
    if (html !== sec.html) { sec.head.innerHTML = html; sec.html = html }
    if (container.children[i] !== sec.el) container.insertBefore(sec.el, container.children[i] || null)
  })

  // Tiles, keyed so animations survive polls
  const keep = new Set(active.map((s) => s.sessionId))
  for (const [id, t] of tiles) if (!keep.has(id)) { t.el.remove(); tiles.delete(id) }
  for (const g of groups) g.list.forEach((s, i) => {
    const grid = sections.get(`${groupBy}:${g.key}`).grid
    let t = tiles.get(s.sessionId)
    if (!t) {
      const el = document.createElement('button')
      el.dataset.session = s.sessionId
      t = { el, html: '', lastEvent: null }
      tiles.set(s.sessionId, t)
    }
    const cls = `tile s-${s.state}${isStale(s) ? ' stale' : ''}`
    if (t.el.className.replace(/\s*blip/, '') !== cls) t.el.className = cls
    const html = tileHtml(s)
    if (html !== t.html) { t.el.innerHTML = html; t.html = html }
    const lastEvent = s.events.at(-1)?.t ?? null
    if (t.lastEvent !== null && lastEvent !== t.lastEvent && s.state !== 'waiting') {
      t.el.classList.remove('blip'); void t.el.offsetWidth; t.el.classList.add('blip')
    }
    t.lastEvent = lastEvent
    if (grid.children[i] !== t.el) grid.insertBefore(t.el, grid.children[i] || null)
  })
  const used = new Set(groups.map((g) => `${groupBy}:${g.key}`))
  for (const [id, sec] of sections) if (!used.has(id)) { sec.el.remove(); sections.delete(id) }

  $('empty').innerHTML = active.length ? '' : `<div class="empty-all">No live sessions. Start <code>claude</code> anywhere with the session-board plugin loaded.</div>`

  // Ended & stale
  past.sort((a, b) => b.updatedAt - a.updatedAt)
  $('past').hidden = !past.length
  $('past-summary').textContent = `Ended or gone (${past.length}, last 24h)`
  const rows = past.map((s) => `
    <button class="row" data-session="${esc(s.sessionId)}">
      <span class="p">${esc(projectOf(s))}${s.workItem ? ` · #${esc(s.workItem)}` : ''}${s.tabTitle ? ` · ${esc(s.tabTitle)}` : ''}</span>
      <span class="x">${esc(s.skill ? '/' + s.skill.name : s.prompt || '')}</span>
      <span class="w">${s.state === 'ended' ? `ended ${clock(s.updatedAt)}` : `no heartbeat since ${clock(s.updatedAt)}`}</span>
    </button>`).join('')
  if ($('rows').dataset.html !== rows) { $('rows').innerHTML = rows; $('rows').dataset.html = rows }

  if (openId) renderDrawer()
  tick()
}

// Favicon: a 2x2 board of tiles, so the tab is easy to find. When a session needs
// you, the whole icon turns pink; when the server can't be reached, it goes grey.
// The tile colors match the dashboard's (running, background, idle, faint).
const FAVICON = {
  ok: { back: '#14151b', tiles: ['#8be9fd', '#bd93f9', '#50fa7b', '#868ba0'] },
  waiting: { back: '#ff79c6', tiles: ['#14151b', '#14151b', '#14151b', '#14151b'] },
  error: { back: '#14151b', tiles: ['#5b6075', '#5b6075', '#5b6075', '#5b6075'] },
}
let faviconState = null
function setFavicon(state) {
  if (state === faviconState) return
  faviconState = state
  const { back, tiles: [a, b, c, d] } = FAVICON[state]
  const tile = (x, y, fill) => `<rect x="${x}" y="${y}" width="10" height="10" rx="2.5" fill="${fill}"/>`
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="${back}"/>`
    + tile(5, 5, a) + tile(17, 5, b) + tile(5, 17, c) + tile(17, 17, d) + '</svg>'
  $('favicon').href = 'data:image/svg+xml,' + encodeURIComponent(svg)
}

function setSort(by) {
  sortBy = by
  try { localStorage.setItem('sessionBoard.sort', by) } catch {}
  markSort()
  render()
}
function markSort() {
  for (const b of document.querySelectorAll('[data-sort]')) b.setAttribute('aria-pressed', String(b.dataset.sort === sortBy))
  for (const b of document.querySelectorAll('[data-group-by]')) b.setAttribute('aria-pressed', String(b.dataset.groupBy === groupBy))
}

// Live counters tick between polls.
function tick() {
  const now = Date.now()
  for (const el of document.querySelectorAll('[data-since]')) {
    const text = el.dataset.prefix + dur(now - Number(el.dataset.since))
    if (el.textContent !== text) el.textContent = text
  }
  for (const el of document.querySelectorAll('[data-until]')) {
    const left = Number(el.dataset.until) - now
    const text = left > 0 ? el.dataset.prefix + dur(left) : el.dataset.expired
    if (el.textContent !== text) el.textContent = text
    el.classList.toggle('low', left > 0 && left <= CACHE_LOW_MS)
  }
}
setInterval(() => { if (!document.hidden) tick() }, 1000)

// ---- Drawer ---------------------------------------------------------------

function cacheDrawerText(s) {
  const c = cacheExpiry(s)
  const ttl = `${c.ttl} TTL${c.isAssumed ? ', assumed' : ''}`
  if (s.state === 'running') return `in use (${ttl})`
  const at = Date.now() < c.until ? 'warm until' : 'expired'
  return `${at} ${esc(clock(c.until))} · last used ${esc(clock(s.cache.at))} (${ttl})`
}

function drawerHtml(s) {
  const out = []
  out.push(`<h3>Session</h3><dl class="kv">
    <dt>state</dt><dd>${esc(isStale(s) ? 'no heartbeat' : STATE_WORD[s.state])}${s.endReason ? ` (${esc(s.endReason)})` : ''}</dd>
    <dt>directory</dt><dd>${esc(s.cwd)}</dd>
    ${s.repo?.remote ? `<dt>remote</dt><dd>${esc(s.repo.remote)}</dd>` : ''}
    ${s.tabTitle ? `<dt>terminal tab</dt><dd>${esc(s.tabTitle)}</dd>` : ''}
    <dt>started</dt><dd>${esc(new Date(s.startedAt).toLocaleString())}</dd>
    ${s.model ? `<dt>model</dt><dd>${esc(s.model)}</dd>` : ''}
    ${s.context?.percent != null ? `<dt>context</dt><dd>${Math.round(s.context.percent)}% of ${Math.round(s.context.window / 1000)}k</dd>` : ''}
    ${s.costUsd != null ? `<dt>cost</dt><dd>$${s.costUsd.toFixed(2)}</dd>` : ''}
    ${s.cache ? `<dt>prompt cache</dt><dd>${cacheDrawerText(s)}</dd>` : ''}
    <dt>session id</dt><dd>${esc(s.sessionId)}</dd>
  </dl>
  <button class="copy" data-copy="claude --resume ${esc(s.sessionId)}">copy  claude --resume ${esc(s.sessionId.slice(0, 8))}…</button>`)

  if (s.memory) {
    const m = s.memory
    const trend = memTrend(m)
    out.push(`<h3>Memory</h3><dl class="kv">
      <dt>claude.exe</dt><dd>${mb(m.mb)} · ${mb(m.wsMb)} in RAM · PID ${m.pid}</dd>
      ${trend ? `<dt>trend</dt><dd>${esc(trend)}</dd>` : ''}
      ${m.children.map((c) => `<dt>${esc(c.label)}</dt><dd>${mb(c.mb)}${c.procs > 1 ? ` · ${c.procs} processes` : ''}</dd>`).join('')}
      <dt>total</dt><dd>${mb(memTotal(m))} · sampled ${esc(clock(m.at))}</dd>
    </dl>`)
  }

  const crons = cronsOf(s)
  if (crons.length) {
    out.push(`<h3>Scheduled</h3><table class="ag">${crons.map((c) => `
      <tr><td class="ty" title="${esc(c.cron)}">${esc(c.human)}${c.recurring ? '' : ' (once)'}</td>
        <td>${esc(c.prompt)}${c.firedAt ? `<div class="lt">last fired ${esc(clock(c.firedAt))}</div>` : ''}</td>
        <td class="st">${c.nextAt ? `${esc(day(c.nextAt))} · ${countdown(c.nextAt, 'in ', 'due')}` : 'no next time'}</td></tr>`).join('')}</table>`)
  }

  if (s.waiting) out.push(`<h3>Waiting for you</h3><div class="ask"><b>${esc(s.waiting.kind)}</b> · ${live(s.waiting.since)}<div class="d">${esc(s.waiting.detail)}</div></div>`)
  if (s.prompt) out.push(`<h3>Last prompt</h3><div class="quote">${esc(s.prompt)}</div>`)
  if (s.skill) out.push(`<h3>Skill</h3><dl class="kv"><dt>skill</dt><dd>${esc(s.skill.name)}</dd>${s.skill.args ? `<dt>args</dt><dd>${esc(s.skill.args)}</dd>` : ''}${s.workItem ? `<dt>work item</dt><dd>#${esc(s.workItem)}</dd>` : ''}</dl>`)

  if (s.prs?.length) {
    out.push(`<h3>Pull requests</h3><dl class="kv pr-list">${[...s.prs].reverse().map((p) => `
      <dt>${esc(prName(p))}</dt><dd><a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.repo)}</a> · ${clock(p.at)}</dd>`).join('')}</dl>`)
  }

  if (s.done) out.push(`<h3>Done</h3><dl class="kv"><dt>said at</dt><dd>${esc(clock(s.done.at))}</dd>${s.done.note ? `<dt>note</dt><dd>${esc(s.done.note)}</dd>` : ''}</dl>`)
  if (s.shells?.length) {
    out.push(`<h3>In the background</h3><div class="activity">${s.shells.map((b) => `
      <div class="act"><span class="what">${esc(b.summary || b.id)}</span><span class="t">${live(b.since)}</span></div>`).join('')}</div>`)
  }

  if (s.tools.length) {
    out.push(`<h3>Running now</h3><div class="activity">${s.tools.map((t) => `
      <div class="act"><span class="what">${esc(t.tool)}${t.summary ? ` · ${esc(t.summary)}` : ''}</span><span class="t">${live(t.since)}</span></div>`).join('')}</div>`)
  }
  if (s.agents.length) {
    out.push(`<h3>Agents</h3><table class="ag">${[...s.agents].reverse().map((a) => `
      <tr><td class="ty">${esc(a.type)}</td>
        <td>${esc(a.description)}${a.lastTool ? `<div class="lt">${esc(a.lastTool)}</div>` : ''}</td>
        <td class="st" style="color:${a.status === 'done' ? 'var(--ok)' : a.status === 'failed' ? 'var(--you)' : 'var(--bg-agent)'}">
          ${esc(a.status)} ${a.endedAt ? dur(a.endedAt - a.since) : live(a.since)}</td></tr>`).join('')}</table>`)
  }
  out.push(`<h3>Timeline</h3><div class="timeline">${[...s.events].reverse().map((e) => `
    <div class="ev ${e.kind}"><span class="tm">${clock(e.t)}</span><span class="k">${esc(e.kind)}</span>
      <span class="tx">${e.agent ? `<span class="ag">${esc(e.agent)}</span>` : ''}${esc(e.text)}</span></div>`).join('')}</div>`)
  return out.join('')
}

function renderDrawer() {
  if (openId === MEMORY_DRAWER) {
    $('d-sub').textContent = 'this PC'
    if ($('d-title').dataset.html !== 'Memory') { $('d-title').textContent = 'Memory'; $('d-title').dataset.html = 'Memory' }
    const html = memoryDrawerHtml()
    if (html !== openHtml) { $('d-body').innerHTML = html; openHtml = html; tick() }
    return
  }
  const s = sessions.find((x) => x.sessionId === openId)
  if (!s) return
  $('d-sub').textContent = [projectOf(s), s.branch].filter(Boolean).join(' · ')
  const title = titleOf(s)
  if ($('d-title').dataset.html !== title) { $('d-title').innerHTML = title; $('d-title').dataset.html = title }
  const html = drawerHtml(s)
  if (html !== openHtml) { $('d-body').innerHTML = html; openHtml = html }
}

function openDrawer(id) {
  openId = id
  openHtml = ''
  document.body.classList.add('open')
  renderDrawer()
  tick()
  $('d-body').parentElement.scrollTop = 0
}
function closeDrawer() {
  openId = null
  document.body.classList.remove('open')
}

document.addEventListener('click', async (e) => {
  const copy = e.target.closest('[data-copy]')
  if (copy) {
    try { await navigator.clipboard.writeText(copy.dataset.copy); copy.textContent = 'copied' } catch { copy.textContent = copy.dataset.copy }
    return
  }
  // A PR link on a tile: the tile is a button, so it can't hold a real <a>.
  const pr = e.target.closest('[data-href]')
  if (pr) return void window.open(pr.dataset.href, '_blank', 'noopener')
  const sort = e.target.closest('[data-sort]')
  if (sort) return setSort(sort.dataset.sort)
  const groupBtn = e.target.closest('[data-group-by]')
  if (groupBtn) return setGroup(groupBtn.dataset.groupBy)
  const add = e.target.closest('[data-new-session]')
  if (add) return void openSession(add.dataset.newSession, add)
  const head = e.target.closest('[data-group-toggle]')
  if (head) return toggleGroup(head.dataset.groupToggle)
  if (e.target.closest('[data-memory]')) return openDrawer(MEMORY_DRAWER)
  const tile = e.target.closest('[data-session]')
  if (tile) return openDrawer(tile.dataset.session)
  if (e.target.closest('[data-close]')) closeDrawer()
})
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeDrawer() })

// ---- Queue ----------------------------------------------------------------

// server/serve.py answers api/queue; python -m http.server doesn't, and the
// form and the queue stay hidden.
let queueServed = null  // unknown until the first answer
let queue = null
const QUEUE_SHOW_ENDED_MS = 6 * 3600_000  // finished items stay listed this long
const QUEUE_SHOW_ENDED = 4
const ENDED_BY = {
  done: 'said it was done', idle: 'went idle', ended: 'session ended', gone: 'session gone',
  'never started': 'session never started', released: 'released by hand',
}

async function loadQueue() {
  try {
    queue = JSON.parse(await fetchText('api/queue'))
  } catch {
    queueServed ??= false
    return
  }
  queueServed = true
  const select = $('launch-cwd')
  const chosen = select.value
  const options = queue.projects.map((p) => `<option value="${esc(p.path)}" title="${esc(p.path)}">${esc(p.name)}</option>`).join('')
  if (select.dataset.html !== options) { select.innerHTML = options; select.dataset.html = options }
  if (queue.projects.some((p) => p.path === chosen)) select.value = chosen
  showMax()
  $('launch-go').title = `queues claude "${queue.prompt}"; it starts in a new terminal when the project has a free slot`
  $('launch').hidden = !queue.projects.length
  renderQueue()
  // The "+" on a project's group needs the server's list of projects.
  if (groupBy === 'project' && queue.projects.length !== projectsShown) { projectsShown = queue.projects.length; render() }
}
let projectsShown = 0

// The server's project for a group of sessions, by the folder they report, or null.
const folderKey = (p) => p.replace(/[\\/]+$/, '').replace(/\//g, '\\').toLowerCase()
function projectFolder(list) {
  if (!queueServed || !queue) return null
  for (const s of list) {
    const folder = s.repo?.root || s.cwd
    const p = folder && queue.projects.find((x) => folderKey(x.path) === folderKey(folder))
    if (p) return p
  }
  return null
}

// Opens an empty session in a project now: not a queue item, so it takes no slot.
async function openSession(cwd, button) {
  const name = queue?.projects.find((p) => p.path === cwd)?.name || cwd
  if (queue?.held && !confirm(`Memory is high (${queue.held}). Open a session in ${name} anyway?`)) return
  button.disabled = true
  say(`opening a session in ${name}…`)
  try {
    await postQueue({ action: 'open', cwd })
    say(`opened a session in ${name}`)
  } catch (err) {
    say(err.message, true)
  } finally {
    button.disabled = false
  }
}

// The selected project's limit: how many of its queued items run at once.
function showMax() {
  const project = queue?.projects.find((p) => p.path === $('launch-cwd').value)
  const select = $('launch-max')
  if (!project || document.activeElement === select) return
  const options = [1, 2, 3, 4, 6, 8].map((n) => `<option value="${n}">${n === 1 ? 'one at a time' : `${n} at once`}</option>`).join('')
  if (select.dataset.html !== options) { select.innerHTML = options; select.dataset.html = options }
  select.value = String(project.max)
}

const ordinal = (n) => (n === 1 ? 'next' : n + ((n % 100 >= 11 && n % 100 <= 13) ? 'th' : ['th', 'st', 'nd', 'rd'][n % 10] || 'th'))

function renderQueue() {
  if (!queue) return
  const now = Date.now()
  const running = queue.items.filter((i) => i.state === 'running')
  const waiting = queue.items.filter((i) => i.state === 'queued')
  const ended = queue.items.filter((i) => !['running', 'queued'].includes(i.state) && now - (i.endedAt || 0) < QUEUE_SHOW_ENDED_MS)
    .sort((a, b) => b.endedAt - a.endedAt).slice(0, QUEUE_SHOW_ENDED)
  // A queued item's place among those waiting for the same project.
  const place = (i) => waiting.filter((w) => w.cwd === i.cwd).indexOf(i) + 1
  const row = (i, st, info, acts) => `
    <div class="q ${esc(i.state)}${st === 'ended' ? ' ended' : ''}">
      <span class="st">${esc(i.state)}</span>
      <span class="p" title="${esc(i.cwd)}">${esc(i.name)}</span>
      <span class="wi">#${esc(i.workItem)}</span>
      <span class="x">${info}</span>
      <span class="acts">${acts.map(([action, label, title]) =>
        `<button data-queue="${action}" data-id="${esc(i.id)}" title="${esc(title)}">${label}</button>`).join('')}</span>
    </div>`
  const html = [
    ...running.map((i) => {
      const s = sessions.find((x) => x.sessionId === i.sessionId)
      const info = s ? `${esc(STATE_WORD[s.state])}${s.done ? ' · said it was done' : ''} · started ${live(i.startedAt)} ago` : `starting · ${live(i.startedAt)}`
      return row(i, 'running', info, [['release', 'release', 'count this one as finished and start the next']])
    }),
    ...waiting.map((i) => row(i, 'queued', `${queue.held ? `<span style="color:var(--warn)">held: ${esc(queue.held)}</span> · ` : ''}${ordinal(place(i))} in ${esc(i.name)} · queued ${clock(i.queuedAt)}`, [
      ['first', '↑', 'move to the front of the queue'],
      ['cancel', 'cancel', 'take it off the queue'],
    ])),
    ...ended.map((i) => row(i, 'ended', esc(i.error || ENDED_BY[i.endedBy] || i.endedBy || i.state) + ` · ${clock(i.endedAt)}`, [])),
  ].join('')
  const el = $('queue')
  el.hidden = !html
  if (el.dataset.html !== html) { el.innerHTML = html; el.dataset.html = html; tick() }
  renderMemory()
}

async function postQueue(body) {
  const res = await fetch('api/queue', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  })
  const data = await res.json()
  if (!res.ok) throw new Error(data.error || `HTTP ${res.status}`)
  await loadQueue()
  return data
}

function say(text, isError = false) {
  const out = $('launch-out')
  out.className = isError ? 'error' : ''
  out.textContent = text
}

$('launch-cwd').addEventListener('focus', loadQueue)
$('launch-cwd').addEventListener('change', showMax)
$('launch-max').addEventListener('change', async () => {
  try {
    const max = Number($('launch-max').value)
    await postQueue({ action: 'limit', cwd: $('launch-cwd').value, max })
    say(max === 1 ? 'one at a time here' : `${max} at once here`)
  } catch (err) {
    say(err.message, true)
  }
})
$('launch').addEventListener('submit', async (e) => {
  e.preventDefault()
  const go = $('launch-go')
  go.disabled = true
  say('queueing…')
  try {
    const item = await postQueue({ action: 'add', workItem: $('launch-id').value, cwd: $('launch-cwd').value })
    say(item.state === 'running' ? `started #${item.workItem}` : item.state === 'failed' ? item.error : `queued #${item.workItem}`, item.state === 'failed')
    $('launch-id').value = ''
  } catch (err) {
    say(err.message, true)
  } finally {
    go.disabled = false
  }
})
$('launch-new').addEventListener('click', () => openSession($('launch-cwd').value, $('launch-new')))
$('queue').addEventListener('click', async (e) => {
  const b = e.target.closest('[data-queue]')
  if (!b) return
  b.disabled = true
  try {
    await postQueue({ action: b.dataset.queue, id: b.dataset.id })
  } catch (err) {
    say(err.message, true)
  }
})

// ---- Poll -----------------------------------------------------------------

let pollTimer = null
let polling = false
async function poll() {
  if (polling) return
  polling = true
  clearTimeout(pollTimer)
  const status = $('status')
  try {
    sessions = await loadSessions()
    render()
    if (queueServed && !document.hidden) await loadQueue()
    status.className = 'status'
    status.innerHTML = `<span class="dot"></span>${clock(Date.now())}`
  } catch (err) {
    setFavicon('error')
    status.className = 'status error'
    status.innerHTML = `<span class="dot"></span>${esc(err.message)}`
  } finally {
    polling = false
    pollTimer = setTimeout(poll, document.hidden ? HIDDEN_POLL_MS : POLL_MS)
  }
}

// Back in view: catch up at once instead of waiting out the slow interval.
document.addEventListener('visibilitychange', () => { if (!document.hidden) poll() })

markSort()
loadPhases().then(poll)
loadQueue()
</script>
</body>
</html>
